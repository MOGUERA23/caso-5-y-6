<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 02 - Caso 5: Parqueadero</title>
    <style>
        :root { --navy: #1c3248; --naranja: #f58a1f; --fondo: #f4f6f8; --borde: #d5dce3; --ok: #1f8a5b; --mal: #c0392b; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--fondo); color: #1b2733; line-height: 1.5; }
        header { background: var(--navy); color: #fff; padding: 1.2rem 1rem 0; border-bottom: 4px solid var(--naranja); }
        .ancho { max-width: 900px; margin: 0 auto; }
        header h1 { margin: 0 0 .8rem; font-size: 1.3rem; }
        nav { display: flex; gap: .5rem; }
        nav button { border: 0; cursor: pointer; font: inherit; font-weight: 600; padding: .7rem 1.2rem; border-radius: 8px 8px 0 0; background: rgba(255,255,255,.12); color: #fff; }
        nav button.activo { background: var(--fondo); color: var(--navy); }
        main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
        section.caso { display: none; }
        section.caso.activo { display: block; }
        .panel { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; }
        .panel h2 { margin: 0 0 .8rem; font-size: 1.1rem; color: var(--navy); }
        .fila { display: flex; flex-wrap: wrap; gap: .7rem; align-items: end; }
        label { display: flex; flex-direction: column; font-size: .85rem; gap: .25rem; flex: 1 1 160px; }
        input { font: inherit; padding: .55rem .7rem; border: 1px solid var(--borde); border-radius: 6px; }
        input:focus-visible, button:focus-visible { outline: 3px solid var(--naranja); outline-offset: 1px; }
        .btn { font: inherit; font-weight: 600; cursor: pointer; border: 0; padding: .6rem 1.1rem; border-radius: 6px; background: var(--naranja); color: #1b1200; }
        .btn.sec { background: var(--navy); color: #fff; }
        .btn.gris { background: #e3e8ed; color: #1b2733; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: .5rem .7rem; text-align: left; border-color: var(--borde); }
        th { background: var(--navy); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .7rem; margin-bottom: 1rem; }
        .dato { background: var(--fondo); border-radius: 8px; padding: .7rem .9rem; }
        .dato span { display: block; font-size: .8rem; color: #566676; }
        .dato strong { font-size: 1.3rem; }
        .msg { margin-top: .8rem; padding: .6rem .9rem; border-radius: 6px; background: var(--fondo); }
        .msg.ok { background: #dff3e8; color: var(--ok); }
        .msg.error { background: #fde2df; color: var(--mal); }
        .agotado { color: var(--mal); font-weight: 600; }
        .vacio { color: #6b7a88; font-style: italic; }
        ol, ul { margin: 0; padding-left: 1.3rem; }
    </style>
</head>
<body>

    <header>
        <div class="ancho">
            <h1>Caso 5: Control de parqueadero con cobro por hora</h1>
        </div>
    </header>

    <main>

        <section id="caso5" class="caso activo">
            <div class="panel">
                <h2>Ingreso de vehículo</h2>
                <div class="fila">
                    <label>Placa
                        <input type="text" id="placaIngreso" placeholder="Ej: ABC123" maxlength="7">
                    </label>
                    <label>Hora de entrada (0-24)
                        <input type="number" id="horaEntrada" min="0" max="24" step="1" placeholder="Ej: 9">
                    </label>
                    <button class="btn" id="btnIngreso">Registrar ingreso</button>
                </div>
            </div>

            <div class="panel">
                <h2>Salida de vehículo</h2>
                <div class="fila">
                    <label>Placa
                        <input type="text" id="placaSalida" placeholder="Ej: ABC123" maxlength="7">
                    </label>
                    <label>Hora de salida (0-24)
                        <input type="number" id="horaSalida" min="0" max="24" step="1" placeholder="Ej: 12">
                    </label>
                    <button class="btn sec" id="btnSalida">Registrar salida y cobrar</button>
                    <button class="btn gris" id="btnReiniciarParqueo">Reiniciar día</button>
                </div>
                <div class="msg" id="msgParqueo">Tarifa: $0.75 por hora.</div>
            </div>

            <div class="panel">
                <h2>Autos estacionados ahora</h2>
                <div class="grid">
                    <div class="dato"><span>Estacionados</span><strong id="cantEstacionados">0</strong></div>
                    <div class="dato"><span>Autos que ya salieron</span><strong id="cantSalieron">0</strong></div>
                    <div class="dato"><span>Total cobrado hoy</span><strong id="totalCobrado">$0.00</strong></div>
                </div>
                <table border="1">
                    <thead>
                        <tr><th>Placa</th><th>Hora de entrada</th></tr>
                    </thead>
                    <tbody id="tablaEstacionados">
                    </tbody>
                </table>
            </div>

            <div class="panel">
                <h2>Cobros del día</h2>
                <table border="1">
                    <thead>
                        <tr><th>Placa</th><th>Horas</th><th>Cobro</th></tr>
                    </thead>
                    <tbody id="tablaCobros">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="./src/app.js" defer
            onerror="alert('No se encontró ./src/app.js. Revisa que la carpeta src esté junto a index.html.')"></script>
</body>
</html>
